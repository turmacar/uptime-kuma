name: Build and push image to GHCR (fork)

on:
  push:
    branches: ["2.5.X"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'turmacar/uptime-kuma'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build frontend (dist)
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, release target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          target: release
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/turmacar/uptime-kuma:${{ steps.ver.outputs.version }}
            ghcr.io/turmacar/uptime-kuma:2
